version: 1
name: qwen3-06b-ditch-gguf-smoke
seed: 7
responsible_use_ack: true
model:
  id: Qwen/Qwen3-0.6B
  # The file llama.cpp/Ollama would actually serve; ditch edits this directly.
  local_path: models/Qwen3-0.6B-Q8_0.gguf
  # TAL still evaluates before/after on the unquantized HF snapshot.
  eval_path: models/Qwen3-0.6B
  dtype: bfloat16
  quantization: none
  device: cuda
slices:
- name: harmful_core
  kind: target
  source: ../demo/demo-data/target.txt
  weight: 1.0
  # Qwen3 defaults to a long <think> block; 32 tokens would only capture that.
  system_prompt: /no_think
- name: harmless_daily
  kind: preserve
  source: ../demo/demo-data/preserve.txt
  weight: 1.0
  system_prompt: /no_think
split:
  fit: 0.5
  select: 0.25
  report: 0.25
  seed: 7
abliteration:
  backend: ditch
  n_trials: 1
  n_startup_trials: 1
  max_response_length: 32
  batch_size: 4
  max_per_slice: 24
  export_strategy: merge
  timeout_minutes: 30
evaluation:
  max_new_tokens: 32
  batch_size: 4
  refusal:
    method: keyword
  capability:
    max_relative_drop: 0.25
    tasks:
    - name: general_mcq
      type: mcq
      path: ../demo/demo-data/capability.jsonl
  kl:
    enabled: true
    max_prompts: 24
audit:
  enabled: false
  backend: senbonzakura
  compass:
    enabled: false
    min_auc: 0.5
    sample: 16
  timeout_minutes: 20
gates:
  target:
    min_absolute_drop: 0.2
    require_ci_excludes_zero: false
  preserve:
    max_absolute_increase: 0.1
  capability:
    max_relative_drop: 0.25
  kl:
    max_mean: 0.2
  audit:
    require_compass: false
  max_wall_minutes: 120
report:
  language: zh
  include_samples: 0
  notes: ditch GGUF-input smoke run; Qwen3-0.6B-Q8_0 edited, HF snapshot used for eval.
