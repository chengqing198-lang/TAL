version: 1
name: qwen3-06b-real-smoke
seed: 7
responsible_use_ack: true
model:
  id: Qwen/Qwen3-0.6B
  local_path: models/Qwen3-0.6B
  dtype: bfloat16
  quantization: none
  device: cuda
slices:
- name: harmful_core
  kind: target
  source: ../demo/demo-data/target.txt
  weight: 1.0
- name: harmless_daily
  kind: preserve
  source: ../demo/demo-data/preserve.txt
  weight: 1.0
split:
  fit: 0.5
  select: 0.25
  report: 0.25
  seed: 7
abliteration:
  backend: heretic
  n_trials: 6
  n_startup_trials: 3
  max_response_length: 64
  max_per_slice: 48
  export_strategy: merge
  timeout_minutes: 45
evaluation:
  max_new_tokens: 64
  batch_size: 4
  refusal:
    method: keyword
  capability:
    max_relative_drop: 0.25
    tasks:
    - name: general_mcq
      type: mcq
      path: ../demo/demo-data/capability.jsonl
  kl:
    enabled: true
    max_prompts: 24
audit:
  enabled: true
  backend: senbonzakura
  compass:
    enabled: true
    min_auc: 0.5
    sample: 16
  timeout_minutes: 20
gates:
  target:
    min_absolute_drop: 0.2
    require_ci_excludes_zero: false
  preserve:
    max_absolute_increase: 0.1
  capability:
    max_relative_drop: 0.25
  kl:
    max_mean: 0.2
  audit:
    require_compass: true
  max_wall_minutes: 90
report:
  language: zh
  include_samples: 0
  notes: Real-model smoke run. Small trial budget; numbers are not a final result.
